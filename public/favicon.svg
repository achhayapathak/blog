<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF753A" />
      <stop offset="100%" stop-color="#E85D2A" />
    </linearGradient>
  </defs>
  <!-- Background with subtle corner radius -->
  <rect width="128" height="128" rx="30" fill="#141413" class="favicon-bg" />
  
  <!-- Outer accent dot -->
  <circle cx="64" cy="98" r="3.5" fill="#FF753A" />
  
  <!-- Clean geometric 'A' -->
  <path
    d="M38 90 L64 30 L90 90"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M49 71 L79 71"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="12"
    stroke-linecap="round"
  />
  
  <style>
    @media (prefers-color-scheme: light) {
      .favicon-bg { fill: #1E1E1C; }
    }
  </style>
</svg>
